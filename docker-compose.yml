services:
  yabooks:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Ключ подписи cookie сессии. Задайте свой секрет (напр. в .env рядом:
      # WEB_SECRET_KEY=...). Без него сессии сбрасываются при каждом рестарте.
      # - WEB_SECRET_KEY=${WEB_SECRET_KEY:?задайте WEB_SECRET_KEY}
      # По http (без TLS) нужен 0, иначе браузер не сохранит cookie.
      # За HTTPS-прокси поставьте 1.
      - WEB_COOKIE_SECURE=1
    restart: unless-stopped
